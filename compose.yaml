version: "3.9"

services:

  # ==========================================================
  # DATABASE (INTERN – IKKE EKSPONERET)
  # ==========================================================
  database:
    image: mysql:8.0
    container_name: elvang-database
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${DATABASE_NAME}
      MYSQL_USER: ${DATABASE_USER}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD}

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      - elvang-network


  # ==========================================================
  # BACKEND (SPRING BOOT – GHCR)
  # ==========================================================
  backend:
    image: ghcr.io/gorillaerne/elvang-backend:latest
    container_name: elvang-backend
    restart: unless-stopped

    depends_on:
      database:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: ${DATABASE_URL}
      SPRING_DATASOURCE_USERNAME: ${DATABASE_USER}
      SPRING_DATASOURCE_PASSWORD: ${DATABASE_PASSWORD}
      JWT_SECRET: ${JWT_TOKEN}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      
    ports:
      - "8080:8080"

    networks:
      - elvang-network


  # ==========================================================
  # FRONTEND (NGINX – GHCR)
  # ==========================================================
  frontend:
    image: ghcr.io/gorillaerne/elvang-frontend:latest
    container_name: elvang-frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "80:80"

    networks:
      - elvang-network


# ==========================================================
# PERSISTENT STORAGE
# ==========================================================
volumes:
  mysql-data:


# ==========================================================
# INTERNAL NETWORK
# ==========================================================
networks:
  elvang-network:
    driver: bridge
